<!-- frontend/dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StegaVault - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside>
            <h2>StegaVault</h2>
            <nav>
                <a href="#notes">My Notes</a>
                <a href="#folders">Folders</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main>
            <!-- Concept: Calls GET /api/notes via fetch() in app.js -->
            <div id="notes-list"></div>
            
            <!-- Note Editor -->
            <div id="editor">
                <!-- Concept: Calls POST /api/notes/create via fetch() in app.js -->
                <input type="text" id="note-title" placeholder="Title">
                <textarea id="note-content" placeholder="Content..."></textarea>
                <input type="file" id="carrier-image" accept="image/*">
                <input type="password" id="encryption-password" placeholder="Encryption Password">
                <button onclick="createSecureNoteAPI()">Secure Note</button>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
