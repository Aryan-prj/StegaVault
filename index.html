<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StegaVault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Secret Toggle (Hidden from jury) -->
    <div id="secret-toggle" class="secret-toggle">
        <span id="btn-mode-u" class="secret-btn active" onclick="setMode('U')" title="User Mode"></span>
        <span id="btn-mode-a" class="secret-btn" onclick="setMode('A')" title="Attacker Mode"></span>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="screen">
        <div class="login-split">
            <div class="login-left">
                <img src="images/login_illustration.jpg" alt="Security Illustration" class="login-illustration">
            </div>
            <div class="login-right">
                <div class="login-form-container">
                    <div class="logo">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                        <span>StegaVault</span>
                    </div>
                    
                    <h2>Welcome Back</h2>
                    <p class="subtitle">Please login to access your secure vault.</p>
                    
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="email" value="demo@stegavault.com" placeholder="Email">
                    </div>
                    
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="password" value="Demo@2026Secure" placeholder="Password">
                    </div>
                    
                    <div class="form-actions">
                        <label class="remember">
                            <input type="checkbox" checked> Remember Me
                        </label>
                        <a href="#" class="forgot">Forgot Password?</a>
                    </div>
                    
                    <button class="primary-btn" onclick="login()">Login Now</button>
                </div>
            </div>
        </div>
    </div>

    <!-- User Main Screen -->
    <div id="user-screen" class="screen hidden">
        <div class="sidebar">
            <div class="sidebar-header" onclick="showUserView('all-notes')" style="cursor:pointer;" title="Go to All Notes">
                <div class="sidebar-logo-icon"></div>
                <div>
                    <h2>StegaVault</h2>
                    <p class="user-name">Demo User</p>
                </div>
            </div>
            
            <button class="nav-btn create-note-btn" onclick="showUserView('create-note')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                <span>Create Note</span>
            </button>
            
            <div class="sidebar-search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" placeholder="Search notes..." onkeyup="filterSearch()">
            </div>
            
            <button class="nav-btn" onclick="showArchive()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>
                <span>Archives</span>
            </button>
            
            <div class="folders-section">
                <div class="folders-header" onclick="toggleFolders()" style="cursor:pointer;">
                    <div class="folder-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                        <span>Folders</span>
                    </div>
                    <span class="folder-actions">
                        <span onclick="event.stopPropagation(); createNewFolder()" title="New Folder" style="padding:0 5px; font-weight:bold; font-size:1.2rem;">+</span>
                        <span id="folder-caret" style="display:inline-block; transition:transform 0.2s; margin-left:5px;">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                        </span>
                    </span>
                </div>
                <ul class="folder-list" id="sidebar-folder-list">
                    <!-- Folders injected here -->
                </ul>
            </div>

            <div class="spacer"></div>
            <button class="nav-btn" onclick="toggleDarkMode()" id="btn-dark-mode">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <span>Dark Mode</span>
            </button>
            <button class="nav-btn logout" onclick="logout()">Logout</button>
        </div>
        
        <div class="main-content-wrapper">
            <div class="main-content" id="view-all-notes">
                <div class="header flex-header">
                    <h2 id="current-view-title">My Notes</h2>
                    <div class="time-filters">
                        <button class="time-btn active" onclick="setTimeFilter('Today', this)">Today</button>
                        <button class="time-btn" onclick="setTimeFilter('This Week', this)">This Week</button>
                        <button class="time-btn" onclick="setTimeFilter('This Month', this)">This Month</button>
                        <button class="time-btn" onclick="setTimeFilter('All', this)">All</button>
                    </div>
                </div>
                <div class="notes-cards-container" id="notes-list">
                    <!-- Notes injected here -->
                </div>
            </div>

            <div class="main-content hidden" id="view-create-note">
                <div class="header">
                    <h2 id="editor-title-display">Create Note</h2>
                </div>
                
                <div class="editor-toolbar">
                    <div style="display:flex; gap:10px; align-items:center;">
                        <button title="Bold" onclick="document.execCommand('bold', false, null)"><b>B</b></button>
                        <button title="Italic" onclick="document.execCommand('italic', false, null)"><i>I</i></button>
                        <button title="Underline" onclick="document.execCommand('underline', false, null)"><u>U</u></button>
                        <div class="toolbar-divider"></div>
                        
                        <div class="dropdown">
                            <button class="dropbtn">Insert ▾</button>
                            <div class="dropdown-content">
                                <a href="#" onclick="triggerFileInput('image/*'); return false;">🖼️ Image</a>
                                <a href="#" onclick="triggerFileInput('video/*'); return false;">🎬 Video</a>
                                <a href="#" onclick="triggerFileInput('audio/*'); return false;">🎵 Audio</a>
                                <a href="#" onclick="document.execCommand('insertUnorderedList', false, null); return false;">☑️ List</a>
                            </div>
                        </div>
                    </div>
                    
                    <!-- File input (hidden) -->
                    <input type="file" id="media-upload" style="display:none;" onchange="handleFileUpload(event)">
                    
                    <div style="display:flex; gap:10px; align-items:center; margin-left:auto;">
                        <button title="Save Note" id="btn-save-icon" onclick="proceedToImageSelection()" style="color:var(--primary-color);">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                        </button>
                        <button title="Delete Note" id="btn-delete-icon" onclick="deleteNote()" style="color:#dc3545; display:none;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                </div>
                
                <div class="form-group" style="display:flex; gap:10px; align-items:center;">
                    <input type="text" id="note-title" placeholder="Title" class="clean-input" style="flex:1;">
                    <select id="note-folder" class="clean-select">
                        <option value="General">General</option>
                    </select>
                </div>
                <div class="form-group">
                    <div id="note-body" class="clean-textarea" contenteditable="true" data-placeholder="Write your note here..."></div>
                </div>
                
                <div id="step-1" style="display:none;">
                    <!-- Save and delete buttons moved to toolbar -->
                </div>

                <div id="step-2" class="hidden">
                    <h3>Choose Carrier Image to Secure Note</h3>
                    <div class="image-selection-grid">
                        <img src="images/sunset.jpg" class="carrier-img" onclick="selectImage('images/sunset.jpg', this)">
                        <img src="images/mountain.jpg" class="carrier-img" onclick="selectImage('images/mountain.jpg', this)">
                        <img src="images/forest.jpg" class="carrier-img" onclick="selectImage('images/forest.jpg', this)">
                        <img src="images/city.jpg" class="carrier-img" onclick="selectImage('images/city.jpg', this)">
                        <img src="images/abstract.jpg" class="carrier-img" onclick="selectImage('images/abstract.jpg', this)">
                        <img src="images/desert.jpg" class="carrier-img" onclick="selectImage('images/desert.jpg', this)">
                        <img src="images/ocean.jpg" class="carrier-img" onclick="selectImage('images/ocean.jpg', this)">
                        <img src="images/space.jpg" class="carrier-img" onclick="selectImage('images/space.jpg', this)">
                    </div>
                    <button class="primary-btn secure-btn" onclick="secureNote()" id="btn-secure" disabled>Finalize & Secure</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Attacker Screen -->
    <div id="attacker-screen" class="screen hidden">
        <div class="attacker-header">
            <h2>Photos</h2>
            <button class="nav-btn logout" onclick="logout()">Logout</button>
        </div>
        <div class="attacker-gallery" id="attacker-gallery">
            <!-- Images injected here -->
        </div>
    </div>

    <!-- Image Modal for Attacker -->
    <div id="image-modal" class="modal hidden" onclick="closeModal()">
        <img id="modal-img" src="">
    </div>

    <script src="app.js"></script>
</body>
</html>
